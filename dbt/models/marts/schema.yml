version: 2

models:
  - name: mart_product_performance

    description: >
      Analytical data mart presenting product performance
      by one-hour time window. This model is intended
      for product analysis and consumption by dashboards.

    columns:

      - name: window_start
        description: "Start date and time of the time window."
        tests:
          - not_null

      - name: window_end
        description: "End date and time of the time window."
        tests:
          - not_null

      - name: product_id
        description: "ID of the analyzed product."
        tests:
          - not_null

      - name: total_events
        description: "Total number of events associated with the product during the time window."
        tests:
          - not_null

      - name: views
        description: "Number of views of the product."
        tests:
          - not_null

      - name: add_to_carts
        description: "Number of times the product was added to the cart."
        tests:
          - not_null

      - name: purchases
        description: "Number of purchases made for the product."
        tests:
          - not_null

      - name: revenue
        description: "Revenue generated by the product during the time window."
        tests:
          - not_null

      - name: unique_users
        description: "Approximate number of unique users who generated events for the product."
        tests:
          - not_null

      - name: unique_viewers
        description: "Approximate number of unique users who viewed the product."
        tests:
          - not_null

      - name: unique_buyers
        description: "Approximate number of users who have made at least one purchase."
        tests:
          - not_null

      - name: conversion_rate
        description: "Ratio between the number of unique buyers and the number of unique visitors."
        tests:
          - not_null

      - name: purchase_rate
        description: "Ratio of the number of purchases to the total number of events."
        tests:
          - not_null

      - name: revenue_per_purchase
        description: "Average revenue generated per purchase for the product."
        tests:
          - not_null

      - name: events_per_user
        description: "Average number of events per user."
        tests:
          - not_null

  - name: mart_user_activity

    description: >
      Analytic data mart presenting user activity in one-hour time windows. 
      This model is designed for user behavior analysis and consumption by dashboards.

    columns:

      - name: window_start
        description: >
          Start date and time of the time window.
        tests:
          - not_null

      - name: window_end
        description: >
          End date and time of the time window.
        tests:
          - not_null

      - name: user_id
        description: >
          ID of the analyzed user.
        tests:
          - not_null

      - name: total_events
        description: >
          Total number of events generated by the user during the time window.
        tests:
          - not_null

      - name: views
        description: >
          Number of view type generated by the l'user.
        tests:
          - not_null

      - name: add_to_carts
        description: >
          Number of times the user added items to the cart.
        tests:
          - not_null

      - name: purchases
        description: >
          Number of purchases made by the user.
        tests:
          - not_null

      - name: revenue
        description: >
          Revenue generated by the user during the time window.
        tests:
          - not_null

      - name: revenue_per_purchase
        description: >
          Average revenue generated per user purchase.
        tests:
          - not_null

      - name: unique_products
        description: >
          Number of distinct products with which the user interacted during the time window.
        tests:
          - not_null

      - name: events_per_product
        description: >
          Average number of events generated per distinct product for the user.
        tests:
          - not_null

      - name: purchase_rate
        description: >
          Ratio between the number of purchases and the total number of events generated by the user.
        tests:
          - not_null