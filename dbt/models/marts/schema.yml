version: 2

models:
  - name: mart_product_performance

    description: >
      Analytical data mart presenting product performance
      by time window, based on Gold metrics.

    columns:

      - name: window_start
        description: "Start of the time window."
        tests:
          - not_null

      - name: window_end
        description: "End of the time window."
        tests:
          - not_null

      - name: product_id
        description: "Product ID."
        tests:
          - not_null

      - name: total_events
        description: "Total number of events associated with the product."
        tests:
          - not_null

      - name: views
        description: "Number of views of the product."
        tests:
          - not_null

      - name: add_to_carts
        description: "Number of additions to the cart."
        tests:
          - not_null

      - name: purchases
        description: "Number of purchases."
        tests:
          - not_null

      - name: revenue
        description: "Revenue generated by the product."
        tests:
          - not_null

      - name: unique_users
        description: "Approximate number of unique users."
        tests:
          - not_null

      - name: unique_viewers
        description: "Number of users who viewed the product."
        tests:
          - not_null

      - name: unique_buyers
        description: "Number of users who bought the product."
        tests:
          - not_null

      - name: conversion_rate
        description: "Ratio of unique buyers to unique visitors of the product."
        tests:
          - not_null

      - name: purchase_rate
        description: "Ratio of purchases to the total number of events. of the product"
        tests:
          - not_null

      - name: revenue_per_purchase
        description: "Average revenue generated per purchase."
        tests:
          - not_null

      - name: events_per_user
        description: "Average number of events per user."
        tests:
          - not_null