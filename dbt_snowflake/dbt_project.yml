# Project name
name: ecommerce_dbt_snowflake

# Project version
version: "1.0.0"

# Configuration profile
profile: ecommerce_dbt_snowflake

# Directories
model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

# Clean generated directories
clean-targets:
  - "target"
  - "dbt_packages"

# Model configuration
models:
  ecommerce_dbt_snowflake:

    # Staging: clean and standardize source data
    staging:
      +materialized: view
      +schema: STAGING

    # Intermediate: reusable business transformations
    intermediate:
      +materialized: view
      +schema: INTERMEDIATE

    # Marts: analytical datasets for reporting
    marts:
      +materialized: table
      +schema: MARTS