      - name: view_to_cart_rate
        description: "Ratio of add-to-cart events to product view events."
        data_tests:
          - not_null

      - name: cart_to_purchase_rate
        description: "Ratio of purchase events to add-to-cart events."
        data_tests:
          - not_null

      - name: revenue_per_purchase
        description: "Average revenue generated per purchase event."
        data_tests:
          - not_null

      - name: revenue_per_buyer
        description: >
          Average revenue per approximate distinct buyer.
          The result is an estimate because unique_buyers is approximate.
        data_tests:
          - not_null

      - name: revenue_per_view
        description: "Revenue generated relative to the number of product view events."
        data_tests:
          - not_null

      - name: events_per_user
        description: >
          Average number of events per approximate distinct user
          who interacted with the product.
        data_tests:
          - not_null


  - name: int_user_metrics
