version: 2

models:

  # ============================================================
  # STAGING MODELS
  # ============================================================

  - name: stg_hourly_metrics
    description: >
      Standardized hourly e-commerce metrics originating from the
      Spark Gold layer. Provides a clean representation of overall
      business activity for each one-hour time window.

    columns:
      - name: window_start
        description: "Start timestamp of the hourly aggregation window."
        data_tests:
          - not_null
          - unique

      - name: window_end
        description: "End timestamp of the hourly aggregation window."
        data_tests:
          - not_null

      - name: total_events
        description: "Total number of e-commerce events recorded during the hourly window."
        data_tests:
          - not_null

      - name: views
        description: "Total number of product view events."
        data_tests:
          - not_null

      - name: add_to_carts
        description: "Total number of add-to-cart events."
        data_tests:
          - not_null

      - name: purchases
        description: "Total number of purchase events."
        data_tests:
          - not_null

      - name: revenue
        description: "Total revenue generated by purchase events during the hourly window."
        data_tests:
          - not_null

      - name: unique_users
        description: >
          Approximate number of distinct users who generated events
          during the hourly window, calculated using Spark
          approx_count_distinct.
        data_tests:
          - not_null


  - name: stg_product_metrics
    description: >
      Standardized product-level e-commerce metrics originating from
      the Spark Gold layer. Each record represents the activity and
      purchasing performance of a product during one hourly window.

    columns:
      - name: product_id
        description: "Identifier of the product."
        data_tests:
          - not_null

      - name: window_start
        description: "Start timestamp of the hourly aggregation window."
        data_tests:
          - not_null

      - name: window_end
        description: "End timestamp of the hourly aggregation window."
        data_tests:
          - not_null

      - name: total_events
        description: "Total number of events associated with the product during the hourly window."
        data_tests:
          - not_null

      - name: views
        description: "Total number of view events associated with the product."
        data_tests:
          - not_null

      - name: add_to_carts
        description: "Total number of add-to-cart events associated with the product."
        data_tests:
          - not_null

      - name: purchases
        description: "Total number of purchase events associated with the product."
        data_tests:
          - not_null

      - name: revenue
        description: "Total revenue generated by the product during the hourly window."
        data_tests:
          - not_null

      - name: unique_users
        description: >
          Approximate number of distinct users who interacted with
          the product during the hourly window.
        data_tests:
          - not_null

      - name: unique_viewers
        description: >
          Approximate number of distinct users who viewed the product
          during the hourly window.
        data_tests:
          - not_null

      - name: unique_buyers
        description: >
          Approximate number of distinct users who purchased the product
          during the hourly window.
        data_tests:
          - not_null

      - name: conversion_rate
        description: >
          Estimated user-based product conversion rate, calculated as
          approximate unique buyers divided by approximate unique viewers.
          Computed in Spark using approximate distinct counts.
        data_tests:
          - not_null


  - name: stg_user_metrics
    description: >
      Standardized user-level e-commerce metrics originating from
      the Spark Gold layer. Each record represents the activity and
      purchasing behavior of one user during one hourly window.

    columns:
      - name: user_id
        description: "Identifier of the user."
        data_tests:
          - not_null

      - name: window_start
        description: "Start timestamp of the hourly aggregation window."
        data_tests:
          - not_null

      - name: window_end
        description: "End timestamp of the hourly aggregation window."
        data_tests:
          - not_null

      - name: total_events
        description: "Total number of events generated by the user during the hourly window."
        data_tests:
          - not_null

      - name: views
        description: "Number of product view events generated by the user."
        data_tests:
          - not_null

      - name: add_to_carts
        description: "Number of add-to-cart events generated by the user."
        data_tests:
          - not_null

      - name: purchases
        description: "Number of purchase events generated by the user."
        data_tests:
          - not_null

      - name: revenue
        description: "Total revenue generated by the user's purchases."
        data_tests:
          - not_null

      - name: unique_products
        description: >
          Approximate number of distinct products interacted with
          by the user during the hourly window.
        data_tests:
          - not_null

      - name: purchase_rate
        description: >
          Proportion of purchase events among all events generated
          by the user during the hourly window. This is an event-based
          rate, not a visitor conversion rate.
        data_tests:
          - not_null


  # ============================================================
  # INTERMEDIATE MODELS
  # ============================================================

  - name: int_hourly_metrics
    description: >
      Enriched hourly e-commerce metrics with additional business KPIs.
      Provides an overview of global activity, purchasing behavior
      and revenue performance.

    columns:
      - name: window_start
        description: "Start timestamp of the hourly aggregation window."
        data_tests:
          - not_null
          - unique

      - name: window_end
        description: "End timestamp of the hourly aggregation window."
        data_tests:
          - not_null

      - name: total_events
        description: "Total number of e-commerce events during the hourly window."
        data_tests:
          - not_null

      - name: views
        description: "Total number of product view events."
        data_tests:
          - not_null

      - name: add_to_carts
        description: "Total number of add-to-cart events."
        data_tests:
          - not_null

      - name: purchases
        description: "Total number of purchase events."
        data_tests:
          - not_null

      - name: revenue
        description: "Total revenue generated by purchase events."
        data_tests:
          - not_null

      - name: unique_users
        description: "Approximate number of distinct users active during the hourly window."
        data_tests:
          - not_null

      - name: purchase_event_rate
        description: >
          Ratio of purchase events to total events during the hourly window.
          This is an event-based metric.
        data_tests:
          - not_null

      - name: view_to_cart_rate
        description: >
          Ratio of add-to-cart events to product view events.
          This is an event-based ratio, not a user-level conversion rate.
        data_tests:
          - not_null

      - name: view_to_purchase_rate
        description: >
          Ratio of purchase events to product view events.
          This is an event-based ratio.
        data_tests:
          - not_null

      - name: revenue_per_purchase
        description: "Average revenue generated per purchase event."
        data_tests:
          - not_null

      - name: events_per_user
        description: >
          Average number of events per approximate distinct user
          during the hourly window.
        data_tests:
          - not_null


