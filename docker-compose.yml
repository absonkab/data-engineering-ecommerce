services:

  # -------------------------------------------------------------------
  # POSTGRESQL Service
  # -------------------------------------------------------------------
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: data_user
      POSTGRES_PASSWORD: data_pass
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"

    # Verify that PostgreSQL is actually accepting connections before starting the services that depend on it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U data_user -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------------
  # PgAdmin Service
  # -------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
  
  # -------------------------------------------------------------------
  # DBT Service
  # -------------------------------------------------------------------
  dbt:
    build:
      context: .
      dockerfile: ./dbt/Dockerfile
    container_name: dbt
    depends_on:
      - postgres
    ports:
      - "8081:8080"  # Port 8081 on Windows port 8080 in lthe dbt container.
    volumes:
      - ./dbt:/usr/app/dbt
    working_dir: /usr/app/dbt
    environment:
      DBT_PROFILES_DIR: /usr/app/dbt # Show dbt where to find profiles.yml
    command: >
      sleep infinity

  # -------------------------------------------------------------------
  # Zookeeper Service
  # -------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  # -------------------------------------------------------------------
  # KAFKA Service
  # -------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # -------------------------------------------------------------------
  # DATA INGESTION Service
  # -------------------------------------------------------------------
  ingestion:
    build:
      context: .
      dockerfile: ./ingestion/Dockerfile
    container_name: ingestion
    depends_on:
      - kafka
    environment:
      KAFKA_BROKER: kafka:9092

  # -------------------------------------------------------------------
  # SPARK Services
  # -------------------------------------------------------------------

  # Master
  spark:
    image: apache/spark:3.5.1
    container_name: spark
    ports:
      - "8080:8080"
      - "7077:7077"
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master

  # Spark worker Service
  spark-worker:
    image: apache/spark:3.5.1
    container_name: spark-worker
    depends_on:
      - spark
    environment:
      SPARK_MASTER: spark://spark:7077
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2G
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark:7077
    volumes:
      - ./lake:/lake

  # Spark job Service
  spark-job:
    build:
      context: .
      dockerfile: ./spark/Dockerfile
    container_name: spark-job
    depends_on:
      - spark
      - spark-worker
      - kafka
    volumes:
      - ./lake:/lake
      - ./tests:/opt/spark/tests
    command: >
      sleep infinity

  # -------------------------------------------------------------------
  # AIRFLOW Services
  # -------------------------------------------------------------------

  # Airflow init
  airflow-init:
    image: apache/airflow:2.10.5-python3.10
    container_name: airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Connection to the PostgreSQL database used by Airflow to store its metadata: DAGs, tasks, runs, etc.
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://data_user:data_pass@postgres:5432/ecommerce
      AIRFLOW_UID: "50000" # Allows Airflow to use the correct UID inside the container.
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin_name
      --password admin_pass
      --firstname Abson
      --lastname Kab
      --role Admin
      --email admin@airflow.com
      "

# Airflow webserver
  airflow-webserver:
    image: apache/airflow:2.10.5-python3.10
    container_name: airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8082:8080"
    environment:
      # Same metadata database as airflow-init.
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://data_user:data_pass@postgres:5432/ecommerce
      AIRFLOW__CORE__LOAD_EXAMPLES: "false" # Disables the loading of example DAGs. This keeps our interface clean.
      AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC # Executes the DAGs using the UTC time zone.
    volumes:
      - ./airflow/dags:/opt/airflow/dags          # The project's DAGs will be stored here.
      - ./airflow/logs:/opt/airflow/logs          # Airflow logs remain accessible from Windows.
    command: webserver

# Airflow scheduler
  airflow-scheduler:
    image: apache/airflow:2.10.5-python3.10
    container_name: airflow-scheduler
    depends_on:
      - airflow-init
    environment:
      # Same metadata database as airflow-init.
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://data_user:data_pass@postgres:5432/ecommerce
      AIRFLOW__CORE__LOAD_EXAMPLES: "false" # No example DAGs.
      AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC  # Default time zone.
    volumes:
      - ./airflow/dags:/opt/airflow/dags # The scheduler must have access to the same DAGs.
      - ./airflow/logs:/opt/airflow/logs # Logs produced by the tasks.
    command: scheduler