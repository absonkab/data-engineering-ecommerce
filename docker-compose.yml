services:

  # -------------------------------------------------------------------
  # POSTGRESQL Service
  # -------------------------------------------------------------------
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      # PostgreSQL credentials are loaded from the local .env file.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"

    # Verify that PostgreSQL is actually accepting connections before starting the services that depend on it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------------
  # PgAdmin Service
  # -------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
  
  # -------------------------------------------------------------------
  # DBT Service
  # -------------------------------------------------------------------
  dbt:
    build:
      context: .
      dockerfile: ./dbt/Dockerfile
    container_name: dbt
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"  # Port 8081 on Windows port 8080 in lthe dbt container.
    volumes:
      - ./dbt:/usr/app/dbt
    working_dir: /usr/app/dbt
    environment:
      DBT_PROFILES_DIR: /usr/app/dbt # Show dbt where to find profiles.yml
      # PostgreSQL connection variables.
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: >
      sleep infinity

  # -------------------------------------------------------------------
  # Zookeeper Service
  # -------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  # -------------------------------------------------------------------
  # KAFKA Service
  # -------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # -------------------------------------------------------------------
  # DATA INGESTION Service
  # -------------------------------------------------------------------
  ingestion:
    build:
      context: .
      dockerfile: ./ingestion/Dockerfile
    container_name: ingestion
    depends_on:
      - kafka
    environment:
      KAFKA_BROKER: kafka:9092

  # -------------------------------------------------------------------
  # SPARK Services
  # -------------------------------------------------------------------

  # Master
  spark:
    image: apache/spark:3.5.1
    container_name: spark
    ports:
      - "8080:8080"
      - "7077:7077"
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master

  # Spark worker Service
  spark-worker:
    image: apache/spark:3.5.1
    container_name: spark-worker
    depends_on:
      - spark
    environment:
      SPARK_MASTER: spark://spark:7077
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY}
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark:7077
    volumes:
      - ./lake:/lake

  # Spark job Service
  spark-job:
    build:
      context: .
      dockerfile: ./spark/Dockerfile
    container_name: spark-job
    depends_on:
      - spark
      - spark-worker
      - kafka
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./lake:/lake
      - ./tests:/opt/spark/tests
    command: >
      sleep infinity

  # Bronze Streaming
  # Reads events from Kafka and persists the raw/structured event stream into the Bronze layer.
  bronze-stream:
    image: data-engineering-ecommerce-spark-job
    container_name: bronze-stream
    depends_on:
      - spark
      - spark-worker
      - kafka
    volumes:
      - ./lake:/lake
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark:7077
      --conf spark.cores.max=${SPARK_STREAM_MAX_CORES}
      --conf spark.executor.cores=${SPARK_STREAM_EXECUTOR_CORES}
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1
      /opt/spark/jobs/bronze_stream.py

  # Silver Streaming
  # Reads Bronze events, validates and cleans them, then writes the resulting stream into Silver layer.
  silver-stream:
    image: data-engineering-ecommerce-spark-job
    container_name: silver-stream
    depends_on:
      - spark
      - spark-worker
      - bronze-stream
    volumes:
      - ./lake:/lake
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark:7077
      --conf spark.cores.max=${SPARK_STREAM_MAX_CORES}
      --conf spark.executor.cores=${SPARK_STREAM_EXECUTOR_CORES}
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1
      /opt/spark/jobs/silver_stream.py

  # Gold Hourly Metrics Streaming
  # Reads Silver events and produces hourly aggregated business metrics.
  gold-hourly:
    image: data-engineering-ecommerce-spark-job
    container_name: gold-hourly
    depends_on:
      - spark
      - spark-worker
      - silver-stream
    volumes:
      - ./lake:/lake
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark:7077
      --conf spark.cores.max=${SPARK_STREAM_MAX_CORES}
      --conf spark.executor.cores=${SPARK_STREAM_EXECUTOR_CORES}
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1
      /opt/spark/jobs/hourly_metrics.py


  # Gold Product Metrics Streaming
  # Reads Silver events and produces business metrics aggregated by product.
  gold-product:
    image: data-engineering-ecommerce-spark-job
    container_name: gold-product
    depends_on:
      - spark
      - spark-worker
      - silver-stream
    volumes:
      - ./lake:/lake
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark:7077
      --conf spark.cores.max=${SPARK_STREAM_MAX_CORES}
      --conf spark.executor.cores=${SPARK_STREAM_EXECUTOR_CORES}
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1
      /opt/spark/jobs/product_metrics.py


  # Gold User Metrics Streaming
  # Reads Silver events and produces aggregated business metrics per user.
  gold-user:
    image: data-engineering-ecommerce-spark-job
    container_name: gold-user
    depends_on:
      - spark
      - spark-worker
      - silver-stream
    volumes:
      - ./lake:/lake
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark:7077
      --conf spark.cores.max=${SPARK_STREAM_MAX_CORES}
      --conf spark.executor.cores=${SPARK_STREAM_EXECUTOR_CORES}
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1
      /opt/spark/jobs/user_metrics.py

  # -------------------------------------------------------------------
  # AIRFLOW Services
  # -------------------------------------------------------------------

  # Airflow init
  airflow-init:
    image: apache/airflow:2.10.5-python3.10
    container_name: airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Connection to the PostgreSQL database used by Airflow to store its metadata: DAGs, tasks, runs, etc.
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      AIRFLOW_UID: "50000" # Allows Airflow to use the correct UID inside the container.

      # Airflow user configuration.
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      AIRFLOW_ADMIN_FIRSTNAME: ${AIRFLOW_ADMIN_FIRSTNAME}
      AIRFLOW_ADMIN_LASTNAME: ${AIRFLOW_ADMIN_LASTNAME}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL}

    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username ${AIRFLOW_ADMIN_USERNAME}
      --password ${AIRFLOW_ADMIN_PASSWORD}
      --firstname ${AIRFLOW_ADMIN_FIRSTNAME}
      --lastname ${AIRFLOW_ADMIN_LASTNAME}
      --role Admin
      --email ${AIRFLOW_ADMIN_EMAIL}
      || true
      "

# Airflow webserver
  airflow-webserver:
    image: apache/airflow:2.10.5-python3.10
    container_name: airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8082:8080"
    environment:
      # Same metadata database as airflow-init.
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false" # Disables the loading of example DAGs. This keeps our interface clean.
      AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC # Executes the DAGs using the UTC time zone.

      # PostgreSQL variables used by Airflow and DockerOperator.
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - ./airflow/dags:/opt/airflow/dags          # The project's DAGs will be stored here.
      - ./airflow/logs:/opt/airflow/logs          # Airflow logs remain accessible from Windows.
      - /var/run/docker.sock:/var/run/docker.sock # Gives Airflow access to the Docker daemon.
    command: webserver

# Airflow scheduler
  airflow-scheduler:
    image: apache/airflow:2.10.5-python3.10
    container_name: airflow-scheduler
    depends_on:
      - airflow-init
    environment:
      # Same metadata database as airflow-init.
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false" # No example DAGs.
      AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC  # Default time zone.

      # PostgreSQL variables used by Airflow and DockerOperator.
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      
    volumes:
      - ./airflow/dags:/opt/airflow/dags            # The scheduler must have access to the same DAGs.
      - ./airflow/logs:/opt/airflow/logs            # Logs produced by the tasks.
      - /var/run/docker.sock:/var/run/docker.sock   # Gives Airflow access to the Docker daemon.
    command: scheduler